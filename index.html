```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dave Support Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Impact', 'Arial Black', 'Courier New', monospace;
    }

    body {
      background-color: transparent;
      min-height: 100vh;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 20px;
    }

    .chat-widget {
      width: 320px;
      height: 420px;
      background-color: #0a0000;
      border: 3px solid #ff0000;
      box-shadow: 0 0 20px #ff0000, inset 0 0 10px #330000;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .chat-header {
      background: linear-gradient(90deg, #800000, #ff0000, #800000);
      background-size: 200% 100%;
      animation: shiftHeader 3s ease infinite;
      color: #ffd700;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #ffd700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @keyframes shiftHeader {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      text-shadow: 1px 1px 2px #000;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      background-color: #ff0000;
      border: 1px solid #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff0000;
      animation: alertPulse 0.8s infinite alternate;
    }

    @keyframes alertPulse {
      from { transform: scale(0.9); opacity: 0.6; }
      to { transform: scale(1.2); opacity: 1; }
    }

    .chat-logs {
      flex: 1;
      background: #050000;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-msg {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      line-height: 1.3;
      word-break: break-word;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }

    .chat-msg.dave {
      background: #400000;
      color: #ffffff;
      border: 1px solid #ff0000;
      align-self: flex-start;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.4);
    }

    .chat-msg.user {
      background: #ffd700;
      color: #000000;
      border: 1px solid #ffcc00;
      align-self: flex-end;
    }

    .chat-input-area {
      display: flex;
      background: #1a0000;
      border-top: 2px solid #ff0000;
      padding: 6px;
      gap: 6px;
    }

    .chat-input {
      flex: 1;
      background: #000000;
      color: #ffffff;
      border: 1px solid #ff0000;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.9rem;
      outline: none;
    }

    .chat-input:focus {
      border-color: #ffd700;

      background: #cc0000;
    }

      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <div class="chat-widget">
    <div class="chat-header">
      <div class="chat-title">
        <div class="status-indicator"></div>
        <span>LIVE SUPPORT - DAVE</span>
      </div>
    </div>
    
    <div class="chat-logs" id="chatLogs">
      <div class="chat-msg dave">
        Dave: YOUR DEVICE IS COMPROMISED PLEASE CALL NOW.
      </div>
    </div>

    <form class="chat-input-area" id="chatForm">
      <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." required autocomplete="off" />
      <button type="submit" class="chat-send-btn">SEND</button>
    </form>
  </div>

  <script>
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBlableep() {
      initAudio();
      if (!audioCtx) return;

      try {
        const now = audioCtx.currentTime;

        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(880, now);
        osc1.frequency.exponentialRampToValueAtTime(440, now + 0.1);

        gain1.gain.setValueAtTime(0.25, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);

        osc1.start(now);
        osc1.stop(now + 0.1);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(1200, now + 0.08);
        osc2.frequency.exponentialRampToValueAtTime(300, now + 0.2);

        gain2.gain.setValueAtTime(0.25, now + 0.08);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);

        osc2.start(now + 0.08);
        osc2.stop(now + 0.2);
      } catch (e) {
        console.error("Audio Context restricted or unavailable", e);
      }
    }

    const chatLogs = document.getElementById('chatLogs');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');

    function appendMessage(text, isUser) {
      const msg = document.createElement('div');
      msg.className = `chat-msg ${isUser ? 'user' : 'dave'}`;
      msg.innerText = isUser ? text : `Dave: ${text}`;
      chatLogs.appendChild(msg);
      chatLogs.scrollTop = chatLogs.scrollHeight;
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const userText = chatInput.value.trim();
      if (!userText) return;

      appendMessage(userText, true);
      chatInput.value = '';

      setTimeout(() => {
        playBlableep();
        appendMessage("YOUR DEVICE IS COMPROMISED PLEASE CALL NOW.", false);
      }, 300);
    });
  </script>
</body>
</html>
